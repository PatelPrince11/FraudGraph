# Production twin of vite.config.ts: serve the built dashboard, forward /api/* to FastAPI.
# The browser sees one origin, so no CORS configuration is needed here either.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Trailing slash on proxy_pass strips the /api/ prefix: /api/alerts -> /alerts.
        # "api" is the service name in docker-compose.yml; Docker's DNS resolves it.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in asset filenames, so they can be cached forever:
    # a changed file gets a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep loading old asset names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
