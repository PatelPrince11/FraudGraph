# Runs on every push to main and every pull request.
# Three jobs; the first two run in parallel, docker waits for both.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres just for this job, same major version as docker-compose.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fraud:fraud@localhost:5432/fraud_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build only (no push): proves both Dockerfiles still work after every change.
      - run: docker build -t fraudgraph-api ./backend
      - run: docker build -t fraudgraph-web ./frontend
